<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>High Cardinality</title>
    <style>
      :root {
        --ink: #3a1d4a;
        --pink: #ff7eb6;
        --lilac: #b69cff;
        --mint: #6fe3c1;
        --paper: #fffafd;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        font: 18px/1.5 ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at 20% 10%, #ffd6ec, transparent 50%),
          radial-gradient(circle at 80% 80%, #d9ccff, transparent 50%), #fff0f7;
        display: grid;
        place-items: end center;
        padding: 16px;
      }
      #loader {
        position: fixed; top: 16px; right: 16px;
        padding: 6px 14px; border-radius: 999px;
        background: var(--paper); border: 2px solid var(--lilac);
        font-size: 14px; box-shadow: 0 4px 0 var(--lilac);
      }
      #loader.ok { border-color: var(--mint); box-shadow: 0 4px 0 var(--mint); }
      #loader.bad { border-color: var(--pink); box-shadow: 0 4px 0 var(--pink); }
      #game, #unsupported { width: min(860px, 100%); margin-bottom: 4vh; }
      #box {
        position: relative; min-height: 9em; padding: 28px 28px 22px;
        background: var(--paper); border: 3px solid var(--pink); border-radius: 28px;
        box-shadow: 0 8px 0 var(--pink); outline: none; cursor: pointer;
      }
      #box:focus-visible { box-shadow: 0 8px 0 var(--pink), 0 0 0 4px var(--lilac); }
      #box.waiting::after { content: '♥'; position: absolute; right: 22px; bottom: 14px; color: var(--pink); }
      #speaker {
        position: absolute; top: -18px; left: 24px; padding: 2px 16px; border-radius: 999px;
        background: var(--lilac); color: white; font-weight: 700;
      }
      #text { margin: 0; white-space: pre-wrap; }
      #choices { display: grid; gap: 10px; margin-top: 18px; }
      #choices button {
        font: inherit; color: var(--ink); text-align: left; padding: 10px 18px; cursor: pointer;
        background: white; border: 2px solid var(--lilac); border-radius: 999px; box-shadow: 0 4px 0 var(--lilac);
      }
      #choices button:hover, #choices button:focus-visible { background: #f4efff; outline: none; transform: translateY(-1px); }
      #unsupported { text-align: center; }
      #unsupported .card { padding: 32px; background: var(--paper); border: 3px solid var(--pink); border-radius: 28px; box-shadow: 0 8px 0 var(--pink); }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; transform: none !important; } }
    </style>
  </head>
  <body>
    <div id="loader" role="status" aria-live="polite">spinning up the collector…</div>
    <main id="game">
      <div id="box" tabindex="0" aria-live="polite">
        <span id="speaker" hidden></span>
        <p id="text"></p>
        <div id="choices"></div>
      </div>
    </main>
    <section id="unsupported" hidden>
      <div class="card">
        <h1>⚠ CLIENT UNSUPPORTED</h1>
        <p class="why"></p>
        <p>(Nobody got sampled out. It's not you, it's your runtime.)</p>
      </div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
