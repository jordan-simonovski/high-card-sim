<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>High Cardinality</title>
    <style>
      :root {
        --ink: #3a1d4a;
        --pink: #ff7eb6;
        --lilac: #b69cff;
        --mint: #6fe3c1;
        --paper: #fffafd;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        min-height: 100dvh;
        font: 18px/1.5 ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, sans-serif;
        color: var(--ink);
        background: radial-gradient(circle at 20% 10%, #ffd6ec, transparent 50%),
          radial-gradient(circle at 80% 80%, #d9ccff, transparent 50%), #fff0f7;
        display: grid;
        place-items: end center;
        padding: 16px;
      }
      #loader {
        position: fixed; top: 16px; right: 16px;
        padding: 6px 14px; border-radius: 999px;
        background: var(--paper); border: 2px solid var(--lilac);
        font-size: 14px; box-shadow: 0 4px 0 var(--lilac);
      }
      #loader.ok { border-color: var(--mint); box-shadow: 0 4px 0 var(--mint); }
      #loader.bad { border-color: var(--pink); box-shadow: 0 4px 0 var(--pink); }
      #game, #unsupported { width: min(860px, 100%); margin-bottom: 4vh; }
      #box {
        position: relative; min-height: 9em; padding: 28px 28px 22px;
        background: var(--paper); border: 3px solid var(--pink); border-radius: 28px;
        box-shadow: 0 8px 0 var(--pink); outline: none; cursor: pointer;
      }
      #box:focus-visible { box-shadow: 0 8px 0 var(--pink), 0 0 0 4px var(--lilac); }
      #box.waiting::after { content: '♥'; position: absolute; right: 22px; bottom: 14px; color: var(--pink); }
      #speaker {
        position: absolute; top: -18px; left: 24px; padding: 2px 16px; border-radius: 999px;
        background: var(--lilac); color: white; font-weight: 700;
      }
      #text { margin: 0; white-space: pre-wrap; }
      #choices { display: grid; gap: 10px; margin-top: 18px; }
      #choices button {
        font: inherit; color: var(--ink); text-align: left; padding: 10px 18px; cursor: pointer;
        background: white; border: 2px solid var(--lilac); border-radius: 999px; box-shadow: 0 4px 0 var(--lilac);
      }
      #choices button:hover, #choices button:focus-visible { background: #f4efff; outline: none; transform: translateY(-1px); }
      #create {
        display: grid; gap: 14px; padding: 28px; background: var(--paper);
        border: 3px solid var(--lilac); border-radius: 28px; box-shadow: 0 8px 0 var(--lilac);
      }
      #create h2 { margin: 0; font-family: ui-monospace, monospace; font-size: 18px; }
      #create label { display: grid; gap: 4px; font-family: ui-monospace, monospace; font-size: 15px; }
      #create input:not([type=checkbox]) {
        font: 18px ui-rounded, system-ui, sans-serif; color: var(--ink); padding: 8px 14px;
        border: 2px solid var(--lilac); border-radius: 14px; background: white;
      }
      #create input:focus-visible { outline: 3px solid var(--pink); outline-offset: 1px; }
      #create fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
      #create legend { font-family: ui-monospace, monospace; font-size: 15px; margin-bottom: 6px; }
      #create small { opacity: 0.7; }
      .chips label {
        display: inline-flex !important; align-items: center; gap: 6px; padding: 6px 14px; cursor: pointer;
        border: 2px solid var(--lilac); border-radius: 999px; background: white; font: 16px ui-rounded, system-ui, sans-serif !important;
      }
      .chips label:has(input:checked) { background: var(--lilac); color: white; }
      .chips label:has(input:focus-visible) { outline: 3px solid var(--pink); }
      .chips input { position: absolute; opacity: 0; pointer-events: none; }
      #custom label { flex: 1 1 140px; }
      #custom .inline { display: flex !important; align-items: center; gap: 8px; flex-basis: 100%; }
      #preview { margin: 0; padding: 12px 16px; border-radius: 16px; background: #fff0f7; min-height: 3em; }
      #preview:empty { display: none; }
      #create-error { margin: 0; color: #c2185b; }
      #create-error:empty { display: none; }
      #create button[type=submit] {
        justify-self: end; font: 700 18px ui-rounded, system-ui, sans-serif; color: white; cursor: pointer;
        padding: 10px 24px; border: 0; border-radius: 999px; background: var(--pink); box-shadow: 0 4px 0 #d94f8f;
      }
      #unsupported { text-align: center; }
      #unsupported .card { padding: 32px; background: var(--paper); border: 3px solid var(--pink); border-radius: 28px; box-shadow: 0 8px 0 var(--pink); }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; transform: none !important; } }
    </style>
  </head>
  <body>
    <div id="loader" role="status" aria-live="polite">spinning up the collector…</div>
    <main id="game">
      <div id="box" tabindex="0" aria-live="polite">
        <span id="speaker" hidden></span>
        <p id="text"></p>
        <div id="choices"></div>
      </div>
      <form id="create" hidden novalidate>
        <h2>span attributes</h2>
        <label>player.name <input name="name" maxlength="40" autocomplete="off" required /></label>
        <label>player.gender <input name="gender" maxlength="60" autocomplete="off" placeholder="anything you like, or leave it blank" /></label>
        <fieldset class="chips">
          <legend>player.pronouns <small>pick as many as you use</small></legend>
          <label><input type="checkbox" name="pronouns" value="they" /> they/them</label>
          <label><input type="checkbox" name="pronouns" value="she" /> she/her</label>
          <label><input type="checkbox" name="pronouns" value="he" /> he/him</label>
          <label><input type="checkbox" name="pronouns" value="xe" /> xe/xem</label>
          <label><input type="checkbox" name="pronouns" value="ze" /> ze/hir</label>
          <label><input type="checkbox" name="pronouns" value="it" /> it/its</label>
          <label><input type="checkbox" name="pronouns" value="custom" /> custom…</label>
          <label><input type="checkbox" name="pronouns" value="name" /> just my name</label>
        </fieldset>
        <fieldset id="custom" hidden>
          <legend>custom pronouns</legend>
          <label>subject <input name="c_they" maxlength="24" placeholder="fae" /></label>
          <label>object <input name="c_them" maxlength="24" placeholder="faer" /></label>
          <label>possessive <input name="c_their" maxlength="24" placeholder="faer" /></label>
          <label>possessive pronoun <input name="c_theirs" maxlength="24" placeholder="faers" /></label>
          <label>reflexive <input name="c_themself" maxlength="24" placeholder="faeself" /></label>
          <label class="inline"><input type="checkbox" name="c_plural" /> uses plural verbs (“they are”)</label>
        </fieldset>
        <p id="preview" aria-live="polite"></p>
        <p id="create-error" role="alert"></p>
        <button type="submit">emit span ♥</button>
      </form>
    </main>
    <section id="unsupported" hidden>
      <div class="card">
        <h1>⚠ CLIENT UNSUPPORTED</h1>
        <p class="why"></p>
        <p>(Nobody got sampled out. It's not you, it's your runtime.)</p>
      </div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
