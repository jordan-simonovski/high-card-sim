# The Service Mesh: the hub. Day 1: Baggage on the first visit, then the three first dates.
# Once those are done, the night (overnight). Day 2: three second dates and Baggage's lost tag,
# any order. Once those are done, the evening: the Collector's party.
id: mesh
start: start
music: mesh
bg: mesh_plaza
nodes:
  start:
    text: ""
    branches:
      - { condition: all_day_two, target: "@party" }
      - { condition: day_two, target: back2 }
      - { condition: all_dated, target: "@overnight" }
      - { condition: first_mesh_visit, target: arrive }
    next: back
  arrive:
    text: "The Service Mesh is a sunny plaza of sidecar-shaped kiosks. Glowing paths run between them, carrying little packets."
    next: baggage_hi
  baggage_hi:
    speaker: baggage
    mood: happy
    text: "Oh, hello! New span! I'll just come along. I always come along."
    next: baggage_tags
  baggage_tags:
    speaker: baggage
    mood: neutral
    text: "I'm Baggage. I carry everyone's key=value pairs. Who's dating who, who retried what, who left whose namespace at 4am. Context!"
    next: baggage_shout
  baggage_shout:
    speaker: baggage
    mood: happy
    text: "EVERYONE! This is {name}! Was NULL for about four seconds. We don't talk about it."
    next: baggage_ask
  baggage_ask:
    speaker: baggage
    mood: neutral
    text: "So! Who are you here to see?"
    choices:
      - { id: who, text: "\"Who's around?\"", target: tour }
      - { id: how, text: "\"How do you know about the NULL thing?\"", target: gossip }
  gossip:
    speaker: baggage
    mood: blush
    text: "Context propagation, love. It was in a header. Everything's in a header if you look."
    next: tour
  tour:
    speaker: baggage
    mood: neutral
    text: "Three pillars, three spots. Logs is in the café that never ends. You'll hear {logs.her} before you see {logs.her}."
    next: tour2
  tour2:
    speaker: baggage
    mood: happy
    text: "Metrics is at the gym, counting reps out loud. It's the most you'll hear from {metrics.him} all day. Traces is… around. One percent of the time."
    next: baggage_spans
  baggage_spans:
    speaker: baggage
    mood: blush
    text: "Oh, and the Collector's OnlySpans? Half the mesh subscribes. Nobody admits it, but it's right there in their headers."
    next: baggage_spans2
  baggage_spans2:
    speaker: baggage
    mood: happy
    text: "Premium tier includes the baggage. That's me. I'm the baggage. I get a cut of every request."
    next: baggage_flicker
  baggage_flicker:
    speaker: baggage
    mood: sad
    text: "Bit quieter than usual round here, mind. People keep flickering. Half my tags point at people who aren't there anymore."
    next: glimpse
  glimpse:
    text: "A blur in a navy jacket jogs past at exactly 3.0 metres per second. Behind you, something lilac flickers and is gone."
    next: hub
  back:
    text: "You're back in the plaza. Baggage waves from a kiosk, already somehow knowing where you've been."
    next: baggage_back
  baggage_back:
    speaker: baggage
    mood: happy
    text: "Back again! I heard how it went. Everyone heard. Well, everyone on the premium tier. I may have propagated it."
    next: hub
  hub:
    text: "Where to?"
    choices:
      - { id: logs, text: "The Archive Café (Logs)", condition: not_dated_logs, target: "@date_logs" }
      - { id: metrics, text: "The Dashboard Gym (Metrics)", condition: not_dated_metrics, target: "@date_metrics" }
      - { id: traces, text: "The Sampling Café (Traces)", condition: not_dated_traces, target: "@date_traces" }
  back2:
    text: "The plaza again. The kiosk shutters are down on the north side, where the lights went out last night, and people are walking the long way round so they don't have to look at it."
    next: hub2
  hub2:
    text: "Where to?"
    choices:
      - { id: logs, text: "Find Logs. {logs.She} said something about a picnic.", condition: not_dated2_logs, target: "@date2_logs" }
      - { id: metrics, text: "The running track (Metrics)", condition: not_dated2_metrics, target: "@date2_metrics" }
      - { id: traces, text: "Wait for Traces at the edge of the lights", condition: not_dated2_traces, target: "@date2_traces" }
      - { id: baggage, text: "Baggage is waving a luggage tag at you", condition: not_lost_tag, target: "@lost_tag" }
