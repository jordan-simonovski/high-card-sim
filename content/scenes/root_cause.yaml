# The wide event. The three clues only add up in the base table. The DBA hands over wide event deltas:
# box the slow spans and every attribute is compared against the rest. tier = onlyspans, service =
# collector.batch_processor, and a different subscriber_id on nearly every span (show: root_cause
# gives the same answer as a query).
# Why it broke: the wide table is columnar and doesn't mind a high-cardinality column. Metrics
# keeps one series per label combination, and the Collector was sending subscriber_id to him as a
# label. He hit his limit and dropped series; the batch processor timed out waiting on him and
# shed its queue: spans, then citizens. The Collector is mortified, not a villain.
id: root_cause
start: arrive
music: incident
bg: registry
nodes:
  arrive:
    text: "Back at the Registry, the DBA has cleared the big table. Index cards everywhere, and everyone crowded round."
    next: recap
  recap:
    speaker: dba
    mood: neutral
    text: "Okay. What we've got. Logs: Metrics is dropping series over subscriber_id. Metrics: nearly every error is OnlySpans. Traces: the requests die in the Collector's batch processor, waiting."
    next: recap2
  recap2:
    speaker: dba
    mood: blush
    text: "Three views, three places, and you carried the context between them in your head. That was hard, and it isn't because you're bad at it. Each of them threw away the part the others needed."
    next: recap3
  recap3:
    speaker: dba
    mood: happy
    text: "events. The wide one. Nobody's sampled it, summed it or cut it short. I've got a view of my own for it. I don't usually show people. You draw a box round whatever looks wrong, and it tells you what's different about it."
    next: open
  open:
    action: open_console:deltas
    text: "The Query Shell opens on a tab you haven't seen before: Deltas. Wide event deltas, the DBA says, as if it were obvious. Every span the Realm wrote, mostly quick, and a dark band along the top where nothing should be."
    next: mine
  mine:
    speaker: dba
    mood: neutral
    text: "Here's the same answer as a query, for the postmortem. Mine never has typos. Mine had one once."
    show: root_cause
    next: ask
  ask:
    speaker: dba
    mood: neutral
    text: "So. What's sampling people out of existence?"
    choices:
      - { id: labels, text: "\"Metrics dropped too many labels.\"", target: hint_labels }
      - { id: batch, text: "\"The batch processor is too slow.\"", target: hint_batch }
      - { id: onlyspans, text: "\"OnlySpans puts a different subscriber_id on every span, and it's reaching Metrics as a label. A new series per span.\"", target: found }
  hint_labels:
    speaker: metrics
    mood: annoyed
    text: "People went missing because of me, coping. Something gave me that much to cope with. Look at the last column."
    next: ask2
  hint_batch:
    speaker: traces
    mood: neutral
    text: "It dies there, yes. Why is it so— so full?"
    next: ask2
  ask2:
    speaker: dba
    mood: neutral
    text: "Look at distinct_subscriber_ids. Which tier has a different one on nearly every span?"
    choices:
      - { id: onlyspans, text: "\"onlyspans. Every span gets its own subscriber_id.\"", target: found }
      - { id: again, text: "Run it again.", target: open }
      - { id: tell, text: "\"Walk me through it?\"", target: told }
  told:
    speaker: dba
    mood: happy
    text: "Gladly. I love this part. free and pro have a handful of subscriber_ids between them. onlyspans has a brand-new one on nearly every span."
    next: explain
  found:
    speaker: dba
    mood: happy
    text: "Yes! Exactly that. I'm going to put it on an index card and frame it."
    next: explain
  explain:
    speaker: dba
    mood: neutral
    text: "Look at my table. It's columnar. subscriber_id is one more column, and a million different values in it don't slow me down at all. I never made a series out of anyone."
    next: explain_b
  explain_b:
    speaker: dba
    mood: neutral
    text: "Metrics isn't built like that. One series for every combination of labels. And the Collector's been passing every span attribute along to Metrics as a label. subscriber_id included."
    next: explain2
  explain2:
    speaker: dba
    mood: sad
    text: "So every OnlySpans span became a brand-new series. Metrics hit the limit and started dropping. The batch processor waits on Metrics, thirty seconds, deadline exceeded, and then its queue sheds whatever's in it. Series, then spans, then people. That's the flickering."
    next: explain3
  explain3:
    speaker: dba
    mood: blush
    text: "You're the highest-cardinality thing in this building, {name}, and my table holds you fine. Metrics was never built to. Nobody should have asked {metrics.him} to."
    next: because
  because:
    speaker: logs
    mood: sad
    text: "So that's what it meant. I wrote that line dozens of times and I never once knew what it meant."
    next: because2
  because2:
    speaker: traces
    mood: neutral
    text: "You wrote it because something was wrong and you were the only one who'd noticed. That's a because. A whole one. I kept it. You can have it."
    next: because3
  because3:
    speaker: logs
    mood: blush
    text: "…Say it again, slower? I want to get it down exactly. I've never had one of those."
    next: col1
  col1:
    speaker: collector
    mood: surprised
    text: "Wait. Wait wait wait. subscriber_id? That's mine. I put that on there."
    next: col2
  col2:
    speaker: collector
    mood: sad
    text: "On every span! So my subscribers could find their spans! It was a FEATURE. It was in the PITCH DECK."
    next: logs
  col3:
    speaker: collector
    mood: blush
    text: "I did this? I sampled people out of existence with a loyalty programme?"
    next: col4
  logs:
    speaker: logs
    mood: neutral
    text: "To be fair, it was a very popular loyalty programme. I logged every signup. There were so many signups."
    next: col3
  col4:
    speaker: collector
    mood: sad
    text: "I just wanted everyone to get everything. Unsampled, uncut. Nobody ever told me no."
    next: hush
  hush:
    text: "Nobody says anything. The Collector's two antenna tufts have gone flat. Somewhere in the stacks, the label maker stops."
    next: dba_no
  dba_no:
    speaker: dba
    mood: sad
    text: "No. Nobody did. I run the schema, so that one's mine. I'm telling you now, and I'm sorry it's this late: no."
    next: card
  card:
    text: "The DBA takes an index card out of a cardigan pocket, the one from the party, and puts it on the table in front of the Collector. -- please don't stamp a new number on every span? (comment only. not enforced.)"
    next: card2
  card2:
    speaker: dba
    mood: sad
    text: "I wrote that during your speech. I practised saying it out loud, the same night. I said it to {name}, doing your voice. I just never said it to you."
    next: card3
  card3:
    speaker: collector
    mood: sad
    text: "…You could have. I'd have listened. I read everything. I'd have read that."
    next: "@resolution"
