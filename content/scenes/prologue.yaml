# Everything before `listening` runs without the query engine: it covers the download.
# Quote every text value: YAML reads a leading { or [ as a mapping or list.
id: prologue
start: ceiling
music: prologue
bg: bedroom_night
nodes:
  ceiling:
    text: "03:12. Your phone lights up the ceiling."
    next: page
  page:
    sfx: pager
    speaker: pager
    text: "CRITICAL: checkout p99 is… yes. All of it. Everything is on fire."
    next: dash
  dash:
    text: "You open the dashboard. Every panel is green. Every panel is lying."
    next: life
  life:
    text: "Fourth page this week. At work you say you're fine. At home you say you're tired. Both are true, and between them they leave out nearly everything."
    next: ack
  ack:
    text: "Your thumb hovers."
    choices:
      - { id: ack, text: "Acknowledge the page", target: through }
      - { id: snooze, text: "Snooze it (five minutes, tops)", target: tilt }
  through:
    music: ingest
    sfx: whoosh
    text: "You tap ACK. Your thumb goes through the glass and keeps going."
    bg: ingest_void
    next: ingest
  tilt:
    music: ingest
    sfx: whoosh
    text: "You tap SNOOZE. The pager, offended, pages harder. The room tilts."
    next: ingest
  ingest:
    text: "The floor turns into a progress bar. You are being… ingested."
    bg: ingest_void
    next: hello
  hello:
    speaker: stranger
    mood: happy
    text: "Oh! A new span. Hi! Wow, you're very high cardinality. Give me a second, I've never had to index one this big."
    next: attributes
  attributes:
    speaker: stranger
    mood: neutral
    text: "Before I take you all the way in, I need your span attributes. All of them. Free text, obviously. We're not animals."
    next: create
  create:
    text: ""
    action: create_character
    next: welcome
  welcome:
    speaker: stranger
    mood: happy
    text: "player.name = \"{name}\". Ooh. That one's going to look great in a GROUP BY."
    next: announce
  announce:
    speaker: stranger
    mood: happy
    text: "EVERYONE! {name} is here! Paged into the wrong world and extremely high cardinality!"
    next: listening
  listening:
    text: ""
    branches:
      - { condition: hesitated, target: slow }
    next: fast
  slow:
    speaker: stranger
    mood: neutral
    text: "You're a slow chooser, {name}. Over three seconds a decision. Someone is going to notice that."
    next: "@registry"
  fast:
    speaker: stranger
    mood: surprised
    text: "You acked fast, {name}. Eager! Someone is going to notice that, too."
    next: "@registry"
