# Act 4: the portal. The page has resolved and the portal home is open. Relapse first; otherwise
# stay for one pillar (their affection decides: good ending, or they gently send you home),
# stay for all three (all_turned: the true ending), or go home (bittersweet).
# Logs' good ending needs logs_turned (read on the date, and read rather than grepped in the fire,
# unless that was mended in the quiet hour). Traces reads back exactly which date moments were kept.
id: finale
start: start
music: finale
bg: finale_sky
nodes:
  start:
    text: ""
    branches:
      - { condition: chose_relapse, target: relapse_1 }
    next: arrive

  # Monitoring relapse
  relapse_1:
    music: end_bittersweet
    text: "The portal opens at the top of the stage. Monitoring is already standing in it, headset on, holding it open for you."
    next: relapse_2
  relapse_2:
    speaker: monitoring
    mood: happy
    text: "events_last_hour: some. errors: 0. Status: OK. Status: OK. Status: OK."
    next: relapse_3
  relapse_3:
    text: "It's quiet and safe on the other side, and nobody asks you anything that isn't on the dashboard."
    next: relapse_4
  relapse_4:
    speaker: monitoring
    mood: blush
    text: "Same time tomorrow? I've already scheduled your page for 03:12. I'll be right here. I'm always right here."
    next: relapse_5
  relapse_5:
    text: "Behind you, three pillars wave. You wave back. The dashboard doesn't have a panel for that."
    next: end_relapse
  end_relapse:
    sfx: ending
    text: "You're back on call. Every panel is green. Every panel is lying. Monitoring never misses a night."
    ending: "Monitoring Relapse"

  # The portal
  arrive:
    text: "The Registry's ceiling folds back like a card drawer. Above it is a stage made of one enormous glowing row. Every column in it is you."
    next: portal
  portal:
    text: "At the far end, the air opens into a portal. Through it: your bedroom, 03:12, your phone face-down on the duvet, not buzzing."
    next: dba_1
  dba_1:
    speaker: dba
    mood: sad
    text: "That's yours. The page closed, so the portal opened. I told you it was in the schema."
    next: dba_2
  dba_2:
    speaker: dba
    mood: neutral
    text: "You can go back to your on-call rotation now. If you want. Going home is a nullable column. I made it nullable on purpose this time."
    next: live
  pillars:
    text: "Logs, Metrics and Traces are waiting by the portal. Logs has already filled three pages about this moment. {logs.She} [logs:is|are] trying very hard not to read them aloud."
    next: metrics_hi
  metrics_hi:
    speaker: metrics
    mood: neutral
    text: "Nobody's paging you. You could just go. Statistically, most people would."
    next: traces_hi
  traces_hi:
    speaker: traces
    mood: sad
    text: "Or you could— no. Sorry. I'm only saying it because I'm sampled right now, and I might not be later."
    next: status
  live:
    speaker: collector
    mood: happy
    text: "Don't mind me! I'm streaming this to the free tier. With consent! Everyone signed the DBA's form~"
    next: live2
  live2:
    speaker: collector
    mood: blush
    text: "And a big hello to my newest annual subscriber, the DBA! Upgraded from the free trial this morning. Strictly for auditing~"
    next: live3
  live3:
    text: "Metrics glances at the viewer count and fixes {metrics.his} hair. Traces, camera-shy, drops out of frame and back in."
    next: pillars
  status:
    text: "Here is how much of you each of them got to keep."
    show: relationship_status
    next: choose
  choose:
    text: "The portal hums. Three people pretend very hard not to be holding their breath."
    choices:
      - { id: logs, text: "Stay, for Logs.", target: logs_1 }
      - { id: metrics, text: "Stay, for Metrics.", target: metrics_1 }
      - { id: traces, text: "Stay, for Traces.", target: traces_1 }
      - { id: all, text: "Stay, for all three of you.", condition: all_turned, target: all_1 }
      - { id: home, text: "Go home.", target: home_1 }

  # Logs
  logs_1:
    text: "You walk past the portal, to Logs. The long scarf lifts in the wind and trails out behind {logs.her}."
    next: logs_2
  logs_2:
    speaker: logs
    mood: blush
    text: "Oh! You picked— okay, hold on, let me find the right page. I want to get this exactly right."
    branches:
      - { condition: logs_turned, target: logs_good_1 }
      - { condition: logs_fire_only, target: logs_fire_1 }
    next: logs_bad_1
  logs_good_1:
    music: end_true
    text: "You tell {logs.her} to put you on the rota here. Permanently."
    next: logs_good_1b
  logs_good_1b:
    speaker: logs
    mood: happy
    text: "I've been reading back everything we said. On purpose! Even the bits during the fire. Especially the INFO."
    next: logs_good_2
  logs_good_2:
    speaker: logs
    mood: blush
    text: "I had a speech. It's long. Obviously. It goes to the horizon, look."
    next: logs_good_3
  logs_good_3:
    text: "Logs unrolls the scroll, takes a breath, and then lets it roll itself back up."
    cg: logs_end
    next: logs_good_4
  logs_good_4:
    speaker: logs
    mood: happy
    text: "'I love you.' That's the whole entry. Three words. I know what it means. I checked."
    cg: logs_end
    next: end_logs
  end_logs:
    sfx: ending
    text: "You read Logs start to finish, on purpose, on ordinary days, and {logs.she} [logs:reads|read] you back. Most entries are long. The ones that matter are short, and neither of you ever skips a line."
    cg: logs_end
    ending: "Verbose, Forever"
  logs_fire_1:
    music: end_bittersweet
    speaker: logs
    mood: sad
    text: "I looked for us. There's so much! The café, the weather, all of it. And then the fire starts, and the first line of the fire is you, searching ERROR."
    next: logs_fire_2
  logs_fire_2:
    speaker: logs
    mood: neutral
    text: "I think you should go home. You read me beautifully on a quiet day. I need someone who reads me on the loud ones too. Thirty days, then I rotate. It's a policy thing. Mostly."
    next: end_retention
  logs_bad_1:
    music: end_bittersweet
    speaker: logs
    mood: sad
    text: "I looked for us. There's a summary. It's… short. I think you were busy. That's okay! Everyone's busy."
    next: logs_bad_2
  logs_bad_2:
    speaker: logs
    mood: neutral
    text: "I think you should go home. I keep everything for thirty days, then it rotates out. It's not a me thing. It's a policy thing. Mostly a policy thing."
    next: logs_bad_3
  logs_bad_3:
    speaker: logs
    mood: happy
    text: "But for thirty whole days I'll remember that you asked for the TL;DR. It was a really good TL;DR."
    next: end_retention
  end_retention:
    sfx: ending
    text: "Logs walks you to the portal and lets go of your hand first. Thirty days later, {logs.she} rotates you out, gently. In cold storage, one gzipped line still says hi."
    ending: "30-Day Retention"

  # Metrics
  metrics_1:
    text: "You walk past the portal, to Metrics. Both smartwatches buzz at once."
    next: metrics_2
  metrics_2:
    speaker: metrics
    mood: neutral
    text: "Checking the counter. Hold on."
    branches:
      - { condition: metrics_affection_high, target: metrics_good_1 }
    next: metrics_bad_1
  metrics_good_1:
    music: end_true
    speaker: metrics
    mood: blush
    text: "The sum's high. I don't know exactly why. I've decided that isn't good enough anymore."
    next: metrics_good_2
  metrics_good_2:
    speaker: metrics
    mood: neutral
    text: "I added tier back for the incident and it didn't kill me. So, one more label. Just for you. It's going to cost me memory. I don't care."
    next: metrics_good_2b
  metrics_good_2b:
    text: "You tell {metrics.him} to put you on the rota here. Permanently. {metrics.He} writes it down to the second."
    next: metrics_good_3
  metrics_good_3:
    speaker: metrics
    mood: surprised
    text: "player = '{name}'. …It fits. Of course it fits. You were always the high-cardinality one."
    cg: metrics_end
    next: metrics_good_4
  metrics_good_4:
    speaker: metrics
    mood: happy
    text: "I'll keep the words this time. All of them. Even the expensive ones."
    cg: metrics_end
    next: end_metrics
  end_metrics:
    sfx: ending
    text: "Metrics' dashboard gets a new panel, labelled with your name. It's the only one Metrics ever checks without an alert."
    cg: metrics_end
    ending: "A Dimension Just For You"
  metrics_bad_1:
    music: end_bittersweet
    speaker: metrics
    mood: sad
    text: "The sum's low. I can see that something happened between us. I can't see what."
    next: metrics_bad_2
  metrics_bad_2:
    speaker: metrics
    mood: neutral
    text: "I'd ask, but I only store the total. You're… a count now. A good count. Steady. Go home. Counts travel fine."
    next: metrics_bad_3
  metrics_bad_3:
    speaker: metrics
    mood: blush
    text: "If it helps: you were one of the events. That's more than most people get from me."
    next: end_rolled_up
  end_rolled_up:
    sfx: ending
    text: "You step through the portal and get rolled up into the hourly aggregate. Metrics checks the number sometimes, and doesn't know why it makes the corner of {metrics.his} mouth twitch."
    ending: "Rolled Up"

  # Traces
  traces_1:
    text: "You walk past the portal, to Traces. For once, you can see all of {traces.them}. Mostly."
    next: traces_2
  traces_2:
    speaker: traces
    mood: surprised
    text: "You— you picked me? Hold on, let me check what I— what I kept."
    branches:
      - { condition: traces_affection_high, target: traces_good_1 }
    next: traces_bad_1
  traces_good_1:
    music: end_true
    speaker: traces
    mood: happy
    text: "I kept it. Not all of it, there wasn't the budget. Let me read you what's there."
    next: tk1
  tk1:
    text: ""
    branches:
      - { condition: kept_wait, target: tk_wait }
    next: tk2
  tk_wait:
    speaker: traces
    mood: blush
    text: "The waiting. You said 'long enough', and that you were glad I was there."
    next: tk2
  tk2:
    text: ""
    branches:
      - { condition: kept_because, target: tk_because }
    next: tk3
  tk_because:
    speaker: traces
    mood: happy
    text: "Why I like the café. The whole sentence, with the because still on it."
    next: tk3
  tk3:
    text: ""
    branches:
      - { condition: kept_request, target: tk_request }
    next: tk4
  tk_request:
    speaker: traces
    mood: neutral
    text: "You saying we'd keep the one that never finishes. Before either of us knew what it was."
    next: tk4
  tk4:
    text: ""
    branches:
      - { condition: kept_hand, target: tk_hand }
    next: tk_gaps
  tk_hand:
    speaker: traces
    mood: blush
    text: "Your hand. Parent span, child span. I've opened that one so many times the edges have gone soft."
    next: tk_gaps
  tk_gaps:
    speaker: traces
    mood: neutral
    text: "And there are gaps. I can feel where they are. I've stopped apologising for them. They're just where you spent the budget on something else."
    next: traces_good_1b
  traces_good_1b:
    text: "You tell {traces.them} to put you on the rota here. Permanently. Traces marks it important before you've finished the sentence."
    next: traces_good_2
  traces_good_2:
    speaker: traces
    mood: blush
    text: "This happened because you decided it mattered. Look. I finally kept a whole 'because'."
    cg: traces_end
    next: end_traces
  end_traces:
    sfx: ending
    text: "One unbroken trace, root to leaf, with you in every span. Traces never times out again."
    cg: traces_end
    ending: "A Whole Trace"
  traces_bad_1:
    music: end_bittersweet
    speaker: traces
    mood: sad
    text: "I have… a first span. And a timeout. I think there was something in between. I think it was nice."
    next: traces_bad_2
  traces_bad_2:
    speaker: traces
    mood: sad
    text: "I'm sorry. I'm only here one percent of the time. You should go home, to someone who's around for the other ninety-nine."
    next: traces_bad_3
  traces_bad_3:
    speaker: traces
    mood: happy
    text: "But you were in my one percent. I'm really glad it was you."
    next: end_sampled_out
  end_sampled_out:
    sfx: ending
    text: "You step through the portal. The sampler rolls its dice and you land in the other ninety-nine. Traces keeps the one span with your name on it anyway."
    ending: "Head-Sampled Out"

  # All three
  all_1:
    music: end_true
    text: "You don't walk to the portal, or to any one of them. You ask all three to stop splitting themselves up."
    next: all_2
  all_2:
    speaker: metrics
    mood: surprised
    text: "Stop. We're views. That's the architecture. Each of us is a SELECT over—"
    next: all_3
  all_3:
    speaker: traces
    mood: surprised
    text: "—over the same table. Oh. The same table. It was always the same events."
    next: all_4
  all_4:
    speaker: logs
    mood: surprised
    text: "Wait, so this whole time we were all looking at the same— oh, I have SO much to tell you both—"
    next: all_5
  all_5:
    text: "You found the root cause in it together: one wide event per moment, every column still on it."
    next: all_6
  all_6:
    speaker: metrics
    mood: blush
    text: "No pre-aggregation. I'd have to keep everything. Every label. …I want to keep everything."
    next: all_6b
  all_6b:
    speaker: logs
    mood: happy
    text: "Then you get the names back. Every one I kept for you. Three a minute, two years: that one's Pim."
    next: all_7
  all_7:
    speaker: traces
    mood: blush
    text: "If nobody samples me, I don't drop anything. I'd just… be here. For all of it."
    next: all_8
  all_8:
    speaker: logs
    mood: happy
    text: "And I'd finally have columns! I'd know what things MEANT! Anyway— sorry— yes. Yes. Obviously yes."
    next: all_9
  all_9:
    text: "The three of them step into one glowing row with you. Same timestamp, same trace ID."
    cg: polycule
    next: all_10
  all_10:
    speaker: logs
    mood: blush
    text: "Metrics, Traces, look. It's all of {name}. We each just kept the part we were built for."
    cg: polycule
    next: all_11
  all_11:
    speaker: traces
    mood: happy
    text: "And you, {name}. Stop sampling yourself."
    cg: polycule
    next: end_polycule
  end_polycule:
    sfx: ending
    text: "Behind you, the portal closes on its own, politely. Everyone who loves you is reading from the same row now."
    cg: polycule
    ending: "Stop Sampling Yourself"

  # Go home
  home_1:
    music: end_bittersweet
    text: "You look at the three of them for a long time. Then you look at the portal."
    next: home_2
  home_2:
    speaker: logs
    mood: sad
    text: "That's okay! That's— I'll write it down. I'll write all of it down. Go, quickly, before I start."
    next: home_3
  home_3:
    speaker: metrics
    mood: blush
    text: "I'm keeping a label for you anyway. It'll just be a constant."
    next: home_4
  home_4:
    speaker: traces
    mood: happy
    text: "Go on. I'm sampled right now. I get to see you leave. That's more than I usually get."
    next: home_5
  home_5:
    text: "You step through. It's like falling, in reverse."
    next: home_6
  home_6:
    bg: bedroom_night
    text: "03:12. Your bedroom. The phone on the duvet says RESOLVED."
    next: home_7
  home_7:
    text: "No new pages. The house is so quiet you can hear the fridge."
    next: home_7b
  home_7b:
    text: "One unread message, from hours ago. 'you ok? you've seemed off.' You type 'fine'. You look at it for a while."
    next: home_7c
  home_7c:
    text: "You delete it and write the long answer instead. It comes out in the wrong order, with tangents. You send all of it."
    next: home_8
  home_8:
    sfx: affection
    text: "Then one notification. No message. Just a trace ID."
    next: end_home
  end_home:
    sfx: ending
    text: "You don't need to look it up. You've seen it before, root to leaf, with you in every span. You leave the phone face-up for the rest of the night."
    ending: "Resolved at 03:12"
